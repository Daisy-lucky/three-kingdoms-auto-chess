<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>三国自走棋 - Three Kingdoms Auto Chess</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }
        body {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            font-family: 'Microsoft YaHei', sans-serif;
            overflow: hidden;
            color: #fff;
        }
        #game-container { display: flex; flex-direction: column; height: 100vh; }
        
        /* 顶部信息栏 */
        #top-bar {
            background: linear-gradient(180deg, #2d2d44 0%, #1a1a2e 100%);
            padding: 10px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #8b4513;
        }
        .player-info { display: flex; align-items: center; gap: 15px; }
        .player-avatar {
            width: 50px; height: 50px;
            background: linear-gradient(135deg, #ffd700, #8b4513);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            border: 3px solid #fff;
        }
        .player-stats { display: flex; gap: 15px; }
        .stat { background: rgba(0,0,0,0.3); padding: 5px 15px; border-radius: 5px; }
        .stat-label { font-size: 11px; color: #aaa; }
        .stat-value { font-size: 18px; font-weight: bold; color: #ffd700; }
        .gold-display {
            font-size: 24px;
            color: #ffd700;
            text-shadow: 0 0 10px rgba(255, 215, 0, 0.5);
        }
        
        /* 游戏主区域 */
        #game-area { display: flex; flex: 1; overflow: hidden; }
        
        /* 棋盘区域 */
        #board-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
        }
        #chess-board {
            background: rgba(0,0,0,0.5);
            border: 3px solid #8b4513;
            border-radius: 5px;
        }
        
        /* 右侧面板 */
        #side-panel {
            width: 320px;
            background: linear-gradient(90deg, #1a1a2e 0%, #2d2d44 100%);
            border-left: 2px solid #8b4513;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
        }
        .panel-section {
            padding: 15px;
            border-bottom: 1px solid rgba(139, 69, 19, 0.3);
        }
        .panel-title {
            font-size: 16px;
            font-weight: bold;
            color: #ffd700;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        /* 商店 */
        #shop {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 8px;
        }
        .shop-unit {
            background: linear-gradient(180deg, #2d2d44 0%, #1a1a2e 100%);
            border: 2px solid #444;
            border-radius: 8px;
            padding: 8px;
            cursor: pointer;
            transition: all 0.2s;
            text-align: center;
        }
        .shop-unit:hover {
            border-color: #ffd700;
            transform: translateY(-3px);
            box-shadow: 0 5px 15px rgba(255, 215, 0, 0.3);
        }
        .shop-unit.selected {
            border-color: #00ff00;
            box-shadow: 0 0 15px rgba(0, 255, 0, 0.5);
        }
        .unit-avatar {
            width: 50px;
            height: 50px;
            margin: 0 auto 5px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            position: relative;
        }
        .unit-avatar.cost-1 { background: linear-gradient(135deg, #fff, #ccc); }
        .unit-avatar.cost-2 { background: linear-gradient(135deg, #4caf50, #2e7d32); }
        .unit-avatar.cost-3 { background: linear-gradient(135deg, #2196f3, #1565c0); }
        .unit-avatar.cost-4 { background: linear-gradient(135deg, #9c27b0, #6a1b9a); }
        .unit-avatar.cost-5 { background: linear-gradient(135deg, #ffd700, #ff8c00); }
        .unit-star {
            position: absolute;
            top: -5px;
            right: -5px;
            color: #ffd700;
            font-size: 14px;
        }
        .unit-name { font-size: 11px; margin-bottom: 3px; }
        .unit-cost { font-size: 12px; color: #ffd700; font-weight: bold; }
        
        /* 控制栏 */
        #control-bar {
            background: linear-gradient(0deg, #2d2d44 0%, #1a1a2e 100%);
            padding: 15px 20px;
            border-top: 2px solid #8b4513;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .control-group { display: flex; gap: 10px; align-items: center; }
        .btn {
            background: linear-gradient(180deg, #4a4a6a 0%, #2d2d44 100%);
            border: 2px solid #666;
            color: #fff;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
            transition: all 0.2s;
        }
        .btn:hover {
            background: linear-gradient(180deg, #5a5a7a 0%, #3d3d54 100%);
            border-color: #ffd700;
        }
        .btn-primary {
            background: linear-gradient(180deg, #8b4513 0%, #5c2e0a 100%);
            border-color: #a0522d;
        }
        .btn-primary:hover {
            background: linear-gradient(180deg, #a0522d 0%, #6d360b 100%);
        }
        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        
        /* 装备栏 */
        #equipment-bar {
            display: flex;
            gap: 5px;
            flex-wrap: wrap;
            max-width: 400px;
        }
        .equipment-item {
            width: 40px;
            height: 40px;
            background: rgba(0,0,0,0.5);
            border: 2px solid #666;
            border-radius: 5px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .equipment-item:hover {
            border-color: #ffd700;
            transform: scale(1.1);
        }
        
        /* 羁绊显示 */
        #bond-display {
            display: flex;
            flex-wrap: wrap;
            gap: 5px;
        }
        .bond-tag {
            padding: 3px 8px;
            border-radius: 3px;
            font-size: 11px;
            background: rgba(0,0,0,0.5);
        }
        .bond-active {
            background: rgba(255, 215, 0, 0.3);
            border: 1px solid #ffd700;
            color: #ffd700;
        }
        
        /* 战斗信息 */
        #battle-info {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 48px;
            font-weight: bold;
            text-shadow: 0 0 30px rgba(255, 255, 255, 0.8);
            z-index: 100;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s;
        }
        #battle-info.show { opacity: 1; }
        #battle-info.victory { color: #00ff00; }
        #battle-info.defeat { color: #ff4444; }
        
        /* 回合信息 */
        #round-info {
            position: absolute;
            top: 80px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.8);
            border: 2px solid #ffd700;
            padding: 10px 30px;
            border-radius: 8px;
            font-size: 18px;
            z-index: 50;
        }
        
        /* 开始界面 */
        #start-screen {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.95);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        #start-screen.hidden { display: none; }
        .game-title {
            font-size: 72px;
            color: #ffd700;
            text-shadow: 0 0 30px rgba(255, 215, 0, 0.8), 0 0 60px rgba(255, 215, 0, 0.4);
            margin-bottom: 20px;
        }
        .game-subtitle {
            font-size: 24px;
            color: #fff;
            margin-bottom: 40px;
        }
        .start-btn {
            background: linear-gradient(180deg, #8b4513 0%, #5c2e0a 100%);
            border: 3px solid #ffd700;
            color: #ffd700;
            padding: 20px 60px;
            font-size: 24px;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: bold;
        }
        .start-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 0 40px rgba(255, 215, 0, 0.5);
        }
        
        /* 滚动条 */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #1a1a2e; }
        ::-webkit-scrollbar-thumb { background: #8b4513; border-radius: 4px; }
        
        /* 装备合成面板 */
        #equip-panel {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: linear-gradient(180deg, #2d2d44 0%, #1a1a2e 100%);
            border: 3px solid #ffd700;
            border-radius: 15px;
            padding: 20px;
            z-index: 500;
            max-width: 600px;
        }
        #equip-panel.show { display: block; }
        .equip-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            margin-top: 15px;
        }
    </style>
</head>
<body>
    <!-- 开始界面 -->
    <div id="start-screen">
        <div class="game-title">⚔️ 三国自走棋</div>
        <div class="game-subtitle">Three Kingdoms Auto Chess</div>
        <button class="start-btn" onclick="game.startGame()">开始游戏</button>
    </div>
    
    <div id="game-container">
        <!-- 顶部信息栏 -->
        <div id="top-bar">
            <div class="player-info">
                <div class="player-avatar">👤</div>
                <div class="player-stats">
                    <div class="stat">
                        <div class="stat-label">等级</div>
                        <div class="stat-value" id="player-level">1</div>
                    </div>
                    <div class="stat">
                        <div class="stat-label">血量</div>
                        <div class="stat-value" id="player-hp">100</div>
                    </div>
                    <div class="stat">
                        <div class="stat-label">回合</div>
                        <div class="stat-value" id="round-num">1</div>
                    </div>
                </div>
            </div>
            <div class="gold-display">💰 <span id="gold-count">50</span></div>
        </div>
        
        <!-- 游戏主区域 -->
        <div id="game-area">
            <!-- 棋盘区域 -->
            <div id="board-area">
                <canvas id="chess-board"></canvas>
                <div id="battle-info"></div>
                <div id="round-info">准备阶段</div>
            </div>
            
            <!-- 右侧面板 -->
            <div id="side-panel">
                <!-- 商店 -->
                <div class="panel-section">
                    <div class="panel-title">🏪 商店 <span style="font-size:12px;color:#888;margin-left:auto;">点击购买</span></div>
                    <div id="shop"></div>
                    <div style="display:flex;gap:10px;margin-top:10px;">
                        <button class="btn btn-primary" onclick="game.refreshShop()" style="flex:1;">🔄 刷新 (2 金)</button>
                        <button class="btn" onclick="game.buyExp()" style="flex:1;">📚 买经验 (4 金)</button>
                    </div>
                </div>
                
                <!-- 羁绊 -->
                <div class="panel-section">
                    <div class="panel-title">🔗 激活羁绊</div>
                    <div id="bond-display"></div>
                </div>
                
                <!-- 装备 -->
                <div class="panel-section">
                    <div class="panel-title">🎒 装备 <span style="font-size:12px;color:#888;margin-left:auto;">拖拽穿戴</span></div>
                    <div id="equipment-bar"></div>
                    <button class="btn" onclick="game.showEquipPanel()" style="width:100%;margin-top:10px;">🔧 装备合成</button>
                </div>
                
                <!-- 场上武将 -->
                <div class="panel-section">
                    <div class="panel-title">⚔️ 场上武将 (<span id="unit-count">0</span>/4)</div>
                    <div id="board-units" style="display:flex;flex-wrap:wrap;gap:5px;"></div>
                </div>
            </div>
        </div>
        
        <!-- 底部控制栏 -->
        <div id="control-bar">
            <div class="control-group">
                <button class="btn btn-primary" onclick="game.startBattle()">⚔️ 开始战斗</button>
                <button class="btn" onclick="game.lockUnits()">🔒 锁定阵容</button>
            </div>
            <div class="control-group">
                <button class="btn" onclick="game.showHelp()">❓ 帮助</button>
                <button class="btn" onclick="game.saveGame()">💾 存档</button>
            </div>
        </div>
    </div>
    
    <!-- 装备合成面板 -->
    <div id="equip-panel">
        <div class="panel-title" style="justify-content:space-between;">
            <span>🔧 装备合成</span>
            <button class="btn" onclick="game.hideEquipPanel()" style="padding:5px 10px;">✕</button>
        </div>
        <div style="margin-top:15px;">
            <div style="font-size:14px;color:#aaa;">基础装备</div>
            <div class="equip-grid" id="basic-equip-grid"></div>
        </div>
        <div style="margin-top:20px;">
            <div style="font-size:14px;color:#aaa;">可合成装备</div>
            <div class="equip-grid" id="craft-equip-grid"></div>
        </div>
    </div>
    
    <script src="game.js"></script>
</body>
</html>
